# Local production-like stack: Postgres + app.
#   docker compose up -d --build
#   docker compose exec app node server/scripts/seed.js          # load SRD asset register
#   docker compose exec app node server/scripts/create-admin.js you@stelco.com.mv "Your Name"
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: srd
      POSTGRES_USER: srd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srd"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://srd:${POSTGRES_PASSWORD:-change-me}@db:5432/srd
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Plain http:// on the office network needs this false. Set true once
      # the app is behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    restart: unless-stopped
volumes:
  pgdata:
